<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat</title>
<style>
:root{--bg:#f6f2ff;--fg:#2d2447;--sub:#9a8fb8;--field:#e9e1fb;--btn:#9b7fee;--mine:#8b6cf0;--mineT:#fff;--theirs:#e6dcfa;--theirsT:#2d2447;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1626;--fg:#efeaff;--sub:#9a8fb8;--field:#2a2340;--btn:#6d58b8;--mine:#7b5ce0;--theirs:#352c4f;--theirsT:#efeaff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1626;--fg:#efeaff;--sub:#9a8fb8;--field:#2a2340;--btn:#6d58b8;--mine:#7b5ce0;--theirs:#352c4f;--theirsT:#efeaff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
header .r{display:flex;gap:22px;align-items:center}
svg{width:28px;height:28px;stroke:var(--fg);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib{background:none;border:0;padding:4px;margin:-4px;display:grid;place-items:center;cursor:pointer}
#list{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 13px;border-radius:18px;word-wrap:break-word;white-space:pre-wrap;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.me{align-self:flex-end;background:var(--mine);color:var(--mineT);border-bottom-right-radius:5px}
.fr{align-self:flex-start;background:var(--theirs);color:var(--theirsT);border-bottom-left-radius:5px}
#note{text-align:center;color:var(--sub);font-size:13px;padding:4px}
footer{display:flex;align-items:center;gap:10px;padding:8px 12px 12px}
.plus{width:52px;height:52px;border-radius:50%;background:var(--field);border:0;display:grid;place-items:center;flex:none}
.field{flex:1;display:flex;align-items:center;background:var(--field);border-radius:30px;padding:0 6px 0 20px;height:52px}
.field input{flex:1;border:0;background:transparent;font:inherit;font-size:18px;color:var(--fg);outline:none;min-width:0}
.field input::placeholder{color:var(--sub)}
.mic{background:none;border:0;padding:6px}
.mic svg{width:24px;height:24px}
#rec{display:none;flex:1;align-items:center;gap:10px;min-width:0}
.field.recing #rec{display:flex}
.field.recing input,.field.recing .mic{display:none}
.dot{width:12px;height:12px;border-radius:50%;background:#ff2a2a;animation:bl 1s infinite;flex:none}
@keyframes bl{50%{opacity:.25}}
#rt{font-weight:600;font-variant-numeric:tabular-nums}
#wv{flex:1;display:flex;align-items:center;gap:3px;height:32px;overflow:hidden;min-width:0}
#wv i{flex:1;max-width:4px;min-width:3px;border-radius:2px;background:var(--mine);height:4px;transition:height .09s}
.rl{color:var(--sub);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rc{background:none;border:0;color:var(--fg);font-size:20px;padding:6px 10px}
.go{width:42px;height:42px;border-radius:50%;background:var(--btn);border:0;display:grid;place-items:center;flex:none;margin-left:4px}
.go svg{stroke:#fff;width:22px;height:22px}
#ov{position:fixed;inset:0;background:rgba(40,25,80,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#dr{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:var(--bg);transform:translateX(-100%);transition:transform .25s;z-index:21;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:4px 0 24px rgba(40,25,80,.25)}
body.open #ov{opacity:1;pointer-events:auto}
body.open #dr{transform:none}
#dr h2{margin:6px 8px 14px;font-size:22px}
#dr a{padding:14px 12px;border-radius:14px;font-size:17px;color:var(--fg);cursor:pointer}
#dr a:active{background:var(--field)}
.ct{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding:10px 12px;border-radius:14px;color:var(--fg)}
.ct b{font-size:20px}
.ct .sn{font-size:14px;margin-top:1px}
.ct .ph{font-size:13px;color:var(--sub);margin-top:2px}
#ver{font-size:12px;color:var(--sub);padding:12px 20px}
#num,#login{position:fixed;inset:0;background:rgba(40,25,80,.45);display:none;align-items:center;justify-content:center;z-index:30}
#login{background:var(--bg);z-index:50}
#num.show,#login.show{display:flex}
#num .box,#login .box{background:var(--bg);border-radius:24px;padding:22px;width:min(86%,320px);box-shadow:0 10px 40px rgba(40,25,80,.35)}
#num h3,#login h3{margin:0 0 16px;text-align:center;font-size:20px}
#step2,#step2l,#formF{display:flex;flex-direction:column;gap:12px}
#step2 input,#step2l input{height:52px;border-radius:16px;border:0;background:var(--field);color:var(--fg);padding:0 16px;font:inherit;font-size:18px;outline:none;width:100%}
#step2 button,#step2l button{height:52px;border-radius:16px;border:0;background:var(--mine);color:#fff;font:600 18px system-ui,sans-serif}
.err{color:#d11a2a;font-size:14px;text-align:center;min-height:18px}
#peer{flex:1;min-width:0;padding:0 14px;font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph2{margin:-8px 8px 10px;color:var(--sub);font-size:14px}
body:not(.chatting) footer{visibility:hidden}
.un{display:inline-block;width:10px;height:10px;margin-left:8px;border-radius:50%;background:#ff2a2a;vertical-align:middle}
#menuBtn{position:relative}
#menuBtn.has::after{content:"";position:absolute;top:2px;right:0;width:10px;height:10px;border-radius:50%;background:#ff2a2a}
#admin[hidden]{display:none}
#admin{display:flex;flex-direction:column}
#members .ct{cursor:pointer}
#ctx{position:fixed;display:none;z-index:40;background:var(--bg);border-radius:16px;box-shadow:0 8px 30px rgba(40,25,80,.35);padding:6px;min-width:170px}
#ctx.show{display:block}
#ctx a{display:block;padding:12px 16px;border-radius:12px;font-size:17px;color:var(--fg);cursor:pointer}
#ctx a:active{background:var(--field)}
#pal{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:14px;display:none;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px;background:var(--bg);border-radius:20px;box-shadow:0 8px 30px rgba(40,25,80,.35);z-index:25}
#pal.show{display:grid}
#pal button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
#pal button.on{border-color:var(--fg)}
#lvl{order:9;grid-column:1/-1;margin:6px 0 0;-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:var(--field);outline:none;display:block}
#lvl::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--mine);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.3)}
#lvl::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--mine);border:3px solid #fff}
</style>
</head>
<body>
<header>
  <button class="ib" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 8h18M3 16h18"/></svg></button>
  <div id="peer"></div>
  <div class="r">
    <button class="ib" id="palBtn" aria-label="Цвета"><svg viewBox="0 0 24 24"><path d="M12 4H6a3 3 0 0 0-3 3v11a3 3 0 0 0 3 3h11a3 3 0 0 0 3-3v-6"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
    <svg viewBox="0 0 24 24" style="fill:var(--fg);stroke:none"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
  </div>
</header>
<div id="list"><div id="note">Say hi to your friend 👋</div></div>
<footer>
  <button class="plus" aria-label="Add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="field">
    <input id="in" placeholder="Сообщение" autocomplete="off" enterkeyhint="send">
    <div id="rec"><span class="dot"></span><span id="rt">0:00</span><div id="wv"></div><button id="rc" aria-label="Отмена">✕</button></div>
    <button class="mic" id="mic" aria-label="Mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3" style="fill:var(--fg)"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="go" id="go" aria-label="Send"><svg id="ic" viewBox="0 0 24 24"><path d="M6 8v8M10 5v14M14 8v8M18 10v4"/></svg></button>
  </div>
</footer>
<div id="ov"></div>
<nav id="dr"><h2>Menu</h2><div id="me" class="ph2"></div><div id="members"></div><div id="admin" hidden><a id="addM">Добавить участницу</a><a id="myPin">Сменить мой PIN</a></div><a id="logout">Выйти</a><div id="ver"></div></nav>
<div id="num"><div class="box"><h3 id="formT"></h3><div id="step2"><div id="formF"></div><div id="formE" class="err"></div><button id="save">Готово</button></div></div></div>
<div id="login"><div class="box"><h3>Вход</h3><div id="step2l"><input id="lU" placeholder="Логин" autocomplete="username" autocapitalize="off"><input id="lP" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"><div id="lE" class="err"></div><button id="lGo">Войти</button></div></div></div>
<div id="pal"><input type="range" id="lvl" min="10" max="100" value="65" aria-label="Яркость"></div>
<div id="ctx"></div>
<script src="/app.js"></script>
</body>
</html>
